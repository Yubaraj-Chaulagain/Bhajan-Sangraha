<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BHAJAN SANGAM</title>
<style>
:root{--bg:#101326;--card:#1d2340;--gold:#f5c65b;--muted:#b8bfd8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
header{padding:24px 18px;background:linear-gradient(135deg,#28204c,#714a82);text-align:center}
h1{margin:0;color:var(--gold);font-size:27px}
header p{margin:8px 0 0;color:#eee}
main{padding:12px 14px 30px}
.section{color:var(--gold);margin:18px 0 10px}
.card{background:var(--card);padding:15px;border-radius:15px;margin:10px 0}
.song{display:flex;justify-content:space-between;align-items:center;gap:10px}
.song small{display:block;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
button{background:var(--gold);border:0;border-radius:10px;padding:11px 14px;color:#211a30;font-weight:bold}
audio{width:100%;margin-top:12px}
.muted{color:var(--muted);font-size:13px;line-height:1.6}
.badge{display:inline-block;border:1px solid #70c99b;color:#9be3b9;padding:4px 8px;border-radius:12px;font-size:12px;margin-top:6px}
#now{margin-top:8px}
#songList{padding:0;list-style:none}
.empty{color:var(--muted);padding:12px}
</style>
</head>
<body>
<header>
  <h1>🎵 BHAJAN SANGAM</h1>
  <p>All Religion • All Languages • One Platform</p>
</header>
<main>
  <h3 class="section">🙏 एपभित्र राखिएका गीतहरू (Offline)</h3>
  <div id="songList"><div class="card empty">गीतहरूको सूची लोड हुँदैछ...</div></div>

  <div class="card">
    <h3 class="section">▶ अहिले बजिरहेको</h3>
    <div id="now">गीत छान्नुहोस्</div>
    <audio id="player" controls preload="metadata"></audio>
    <p class="muted" id="status">एपभित्र राखिएका गीतहरू इन्टरनेट नभए पनि चल्छन्।</p>
  </div>

  <div class="card">
    <h3 class="section">🌐 Online गीतहरू</h3>
    <p class="muted">GitHub Repository को लिंक जडान भएपछि Online गीतहरू पनि यहाँ देखिनेछन्।</p>
  </div>
</main>
<script src="song-list.js"></script>
<script>
const player = document.getElementById('player');
player.addEventListener('error', () => {
  document.getElementById('status').textContent = 'गीत फाइल खुल्न सकेन। नयाँ APK मा songs फोल्डरको MP3 समावेश छ कि जाँच गर्नुहोस्।';
});
player.addEventListener('playing', () => {
  document.getElementById('status').textContent = 'गीत बजिरहेको छ।';
});

function playSong(title, file) {
  document.getElementById('now').textContent = title;
  document.getElementById('status').textContent = 'Offline गीत बजिरहेको छ।';
  player.pause();
  player.src = file;
  player.load();
  const playPromise = player.play();
  if (playPromise && typeof playPromise.catch === 'function') {
    playPromise.catch(() => {
      document.getElementById('status').textContent = 'गीत सुरु भएन। तलको Audio Player मा Play थिच्नुहोस्।';
    });
  }
}

function loadOfflineSongs() {
  const list = document.getElementById('songList');
  const songs = window.OFFLINE_SONGS || [];
  list.innerHTML = '';
  if (!songs.length) {
    list.innerHTML = '<div class="card empty">अहिलेसम्म गीत राखिएको छैन। songs फोल्डरमा Audio राखेर फेरि Build गर्नुहोस्।</div>';
    return;
  }
  songs.forEach(song => {
    const card = document.createElement('div');
    card.className = 'card song';
    const info = document.createElement('div');
    const title = document.createElement('b');
    title.textContent = song.title;
    const sub = document.createElement('small');
    sub.textContent = song.file.split('/').pop();
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = 'Offline उपलब्ध';
    info.append(title, sub, badge);

    const button = document.createElement('button');
    button.textContent = 'Play';
    button.addEventListener('click', () => playSong(song.title, song.file));
    card.append(info, button);
    list.append(card);
  });
}
loadOfflineSongs();
</script>
</body>
</html>
